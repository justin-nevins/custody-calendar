name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inline script syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) { console.error("no inline script found"); process.exit(1); }
            fs.writeFileSync("/tmp/inline.js", scripts.join("\n"));
            for (const tag of ["<title>", "</body>", "</html>"]) if (!html.includes(tag)) { console.error("missing " + tag); process.exit(1); }
            console.log("found", scripts.length, "script block(s)");
          '
          node --check /tmp/inline.js
          node --check engine.js
          for f in server/pb_hooks/*.js server/pb_migrations/*.js; do node --check "$f"; done
      - name: Engine runs
        run: node -e 'const E=require("./engine.js"); const r=E.build({v:5,parents:{M:{role:"mother"},F:{role:"father"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"father",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{},customs:[],vacations:{list:[]},changes:[],cal:{start:"2026-12-01",years:1,limit:21,mode:"cap"}}); if(r.result.exchanges.length<5)process.exit(1); console.log("engine ok", r.result.exchanges.length, "exchanges")'
      - name: HTML parses
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.depth=0
          p=P(); p.feed(open('index.html',encoding='utf8').read()); p.close(); print('html ok')
          PY
