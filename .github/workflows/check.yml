name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inline script syntax
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) { console.error("no inline script found"); process.exit(1); }
            fs.writeFileSync("/tmp/inline.js", scripts.join("\n"));
            for (const tag of ["<title>", "</body>", "</html>"]) if (!html.includes(tag)) { console.error("missing " + tag); process.exit(1); }
            console.log("found", scripts.length, "script block(s)");
          '
          node --check /tmp/inline.js
          node --check engine.js
          for f in server/pb_hooks/*.js server/pb_migrations/*.js; do node --check "$f"; done
      - name: Engine runs
        run: node -e 'const E=require("./engine.js"); const r=E.build({v:5,parents:{M:{role:"mother"},F:{role:"father"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"father",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{},customs:[],vacations:{list:[]},changes:[],cal:{start:"2026-12-01",years:2,limit:21,mode:"cap"}}); if(r.result.exchanges.length<5)process.exit(1); console.log("engine ok", r.result.exchanges.length, "exchanges")'
      - name: Fixed-date spans
        run: |
          node -e '
            const E=require("./engine.js"); const Y=2026;
            const t=(a,b,m)=>{ if(JSON.stringify(a)!==JSON.stringify(b)){ console.error("FAIL",m,a,b); process.exit(1);} };
            t(E.CAT.find(h=>h.id==="prexmas").rule.md,[12,18],"fixed rule carries its month-day");
            t(E.CAT.find(h=>h.id==="thanksus").rule.md,undefined,"rule-based holiday has none");
            const sp=E.fixedSpan([12,18],{before:0,after:5},Y); t([E.mdText(sp.s),E.mdText(sp.e)],["12-18","12-23"],"Pre-Christmas span");
            const ny=E.fixedSpan([12,28],{before:0,after:5},Y); t([E.mdText(ny.s),E.mdText(ny.e)],["12-28","01-02"],"New Year span crosses the year");
            t(E.daysFromMd([12,18],"12-22","end",Y),4,"end date to days after");
            t(E.daysFromMd([12,18],"12-17","start",Y),1,"start date to days before");
            t(E.daysFromMd([12,28],"01-02","end",Y),5,"January end counts into the next year");
            t(E.daysFromMd([1,1],"12-30","start",Y),2,"December start counts from the previous year");
            t(E.daysFromMd([12,18],"12/20","end",Y),2,"slash form");
            t(E.daysFromMd([12,18],"nope","end",Y),null,"text that is not a date");
            t(E.daysFromMd([12,18],"02-30","end",Y),null,"day that does not exist");
            t(E.daysFromMd([2,29],"03-01","end",2026),1,"February 29 anchor uses a leap year");
            console.log("fixed-date spans ok");
          '
      - name: Make-up modes
        run: |
          node -e '
            const E=require("./engine.js");
            const st=(makeup)=>({v:5,parents:{M:{role:"mother"},F:{role:"father"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"mother",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{thanksus:{on:true,who:"Modd",before:3,after:4,start:"10:00",end:"10:00"},febtime:{on:true,who:"M",before:0,after:0,start:"00:00",end:"24:00"}},customs:[],vacations:{list:[]},changes:[],cal:{start:"2027-01-02",years:3,limit:21,mode:"cap",makeup}});
            const none=E.build(st("none")).result, fixed=E.build(st("fixed")).result, shift=E.build(st("shift")).result;
            if(!(fixed.madeDays>0)) { console.error("fixed mode made up no days"); process.exit(1); }
            if(!fixed.exchanges.some(x=>x.kind==="makeup")) { console.error("no make-up exchange"); process.exit(1); }
            for(let k=0;k<3;k++){ const a=none.summary[k], b=fixed.summary[k]; if(Math.abs(a.mDays+a.fDays-b.mDays-b.fDays)>1e-6){ console.error("days not conserved"); process.exit(1); } }
            const times=new Set(none.exchanges.filter(x=>x.kind==="regular").map(x=>x.t)), ft=new Set(fixed.exchanges.map(x=>x.t));
            let kept=0; for(const t of times) if(ft.has(t)) kept++; if(kept<times.size*0.8){ console.error("fixed mode moved the cycle dates"); process.exit(1); }
            if(!(shift.shiftDays>0)) { console.error("shift mode shifted nothing"); process.exit(1); }
            console.log("make-up modes ok: made", fixed.madeDays, "days; shift", shift.shiftDays, "days");
          '
      - name: Vacations count toward make-up when set
        run: |
          node -e '
            const E=require("./engine.js");
            const st=(makeup,makeupVac)=>({v:5,parents:{M:{role:"mother"},F:{role:"father"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"mother",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{},customs:[],vacations:{list:[{id:"v1",who:"F",s:"2027-01-05",sh:"10:00",e:"2027-01-12",eh:"10:00",applies:"both"}]},changes:[],cal:{start:"2027-01-02",years:1,limit:21,mode:"none",makeup,makeupVac}});
            const off=E.build(st("fixed",false)).result, on=E.build(st("fixed",true)).result, shiftOn=E.build(st("shift",true)).result, noneOn=E.build(st("none",true)).result;
            if(off.madeDays!==0){ console.error("vacation made up while the setting is off", off.madeDays); process.exit(1); }
            if(!(on.madeDays>=7)){ console.error("vacation not made up with the setting on", on.madeDays); process.exit(1); }
            if(!on.exchanges.some(x=>x.kind==="makeup")){ console.error("no make-up exchange"); process.exit(1); }
            if(!(shiftOn.shiftDays>=7)){ console.error("shift mode ignored the vacation", shiftOn.shiftDays); process.exit(1); }
            if(noneOn.madeDays!==0||noneOn.shiftDays!==0){ console.error("make-up off still made up days"); process.exit(1); }
            console.log("vacation make-up ok: made", on.madeDays, "days; shift", shiftOn.shiftDays, "days");
          '
      - name: Exchange rules
        run: |
          node -e '
            const E=require("./engine.js");
            const base=()=>({v:5,parents:{M:{role:"mother",name:"A"},F:{role:"father",name:"J"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"mother",xtime:"12:00",place:"airport"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN,place:"school"}},holidays:{thanksus:{on:true,who:"Modd",before:3,after:4,start:"10:00",end:"10:00"}},customs:[],vacations:{list:[]},changes:[],xrules:[],cal:{start:"2027-01-02",years:2,limit:21,mode:"none",makeup:"none"}});
            const r0=E.build(base()).result; const s1=base(); s1.xrules=[{applies:"ld",days:{0:true},dates:"",placeKind:"ending",place:"",time:"18:00"}]; const r1=E.build(s1).result;
            const a=r0.exchanges.filter(x=>x.kind==="regular"), b=r1.exchanges.filter(x=>x.kind==="regular");
            if(a.length!==b.length){ console.error("exchange count changed"); process.exit(1); }
            let moved=0; for(let k=0;k<a.length;k++){ const sun=new Date(a[k].t).getUTCDay()===0; const h=new Date(b[k].t).getUTCHours(); if(h!==(sun?18:12)){ console.error("wrong hour at "+new Date(b[k].t).toISOString()); process.exit(1); } if(a[k].t!==b[k].t)moved++; const pl=E.exchangePlace(s1,r1,b[k]); if(pl!==(sun?(b[k].from==="M"?"A":"J")+"\x27s home":"airport")){ console.error("wrong place "+pl); process.exit(1); } }
            if(!moved){ console.error("no exchange moved"); process.exit(1); }
            const ics=E.icsText(r1,{M:"A",F:"J"},{name:"t",S:s1}); if(!/^LOCATION:/m.test(ics)){ console.error("no LOCATION in ics"); process.exit(1); }
            console.log("exchange rules ok:", moved, "exchanges moved to 18:00 on Sundays");
          '
      - name: Swaps, repeats and OFW text
        run: |
          node -e '
            const E=require("./engine.js");
            const base=()=>({v:5,parents:{M:{role:"mother",name:"A"},F:{role:"father",name:"J"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"mother",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{},customs:[],vacations:{list:[]},changes:[],xrules:[],cal:{start:"2027-01-02",years:1,limit:21,mode:"none",makeup:"none"}});
            const r0=E.build(base()).result;
            const sw={id:"s1",kind:"swap",a:{who:"F",s:"2027-01-09",sh:"10:00",e:"2027-01-10",eh:"10:00"},b:{who:"M",s:"2027-01-30",sh:"10:00",e:"2027-01-31",eh:"10:00"},note:"",applies:"both",repeatUntil:""};
            const s1=base(); s1.changes=[sw]; const r1=E.build(s1).result;
            if(!(r1.days["2027-01-09"].f>0&&r1.days["2027-01-30"].m>0)){ console.error("swap legs not applied"); process.exit(1); }
            if(Math.abs(r1.summary[0].fDays-r0.summary[0].fDays)>1e-6){ console.error("even swap changed the totals"); process.exit(1); }
            const g={id:"g1",kind:"give",who:"F",s:"2027-01-05",sh:"18:00",e:"2027-01-06",eh:"08:00",repeatUntil:"2027-01-26"};
            if(E.changePeriods(g,null).length!==4){ console.error("weekly repeat count"); process.exit(1); }
            const s2=base(); s2.changes=[g]; const r2=E.build(s2).result; if(r2.days["2027-01-12"].f!==6){ console.error("repeat not applied"); process.exit(1); }
            if(!E.applyProposal(base(),"change",{item:sw}).changes.length){ console.error("applyProposal swap"); process.exit(1); }
            const t=E.ofwText(s1,sw,{from:"F",to:"M"}); if(!/Section II\.F/.test(t)||!/J asks A/.test(t)){ console.error("ofw text"); process.exit(1); }
            console.log("swaps, repeats and OFW text ok");
          '
      - name: Proposal flow
        run: |
          node -e '
            const E=require("./engine.js");
            const base=()=>({v:5,parents:{M:{role:"mother",name:"A"},F:{role:"father",name:"J"}},children:[],pbd:{M:{},F:{}},regular:{on:true,pattern:"21,11",first:"mother",xtime:"12:00"},phase:{begins:"start",weeklyOn:true,weekAnchor:"2026-12-28",weeksPerCycle:2,weekly:{rows:E.WEEKLY_PLAN}},holidays:{},customs:[],vacations:{list:[]},changes:[],xrules:[],cal:{start:"2027-01-02",years:1,limit:21,mode:"none",makeup:"none"}});
            const item={id:"care1",kind:"give",who:"M",s:"2027-01-29",sh:"17:00",e:"2027-01-30",eh:"10:00",note:"Work trip",applies:"both"};
            const s=E.applyProposal(base(),"care",{item,away:"F"}); if(!s.changes.find(c=>c.id==="care1")){ console.error("care proposal not applied"); process.exit(1); }
            const t=E.ofwText(s,item,{from:"F",to:"M",care:true,kindName:"First option to care",section:"Section II.I, First Option to Care"}); if(!/Section II\.I/.test(t)||!/first option to care/.test(t)){ console.error("care text"); process.exit(1); }
            const a=E.ofwText(s,item,{from:"M",answer:"counter",counter:item}); if(!/proposes instead of/.test(a)||!/Proposed instead/.test(a)){ console.error("counter text"); process.exit(1); }
            console.log("proposal flow ok");
          '
      - name: HTML parses
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.depth=0
          p=P(); p.feed(open('index.html',encoding='utf8').read()); p.close(); print('html ok')
          PY
