<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Custody Calendar</title>
<meta name="description" content="Plan a custody schedule step by step: parents, a long distance schedule, a local schedule, which one is in force when, holidays, vacations and one-time changes. See who has the child today, every exchange, and save it as a calendar file. Runs in your browser.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one app frame; a top bar with three places (Calendar, Settings, Setup); summary first, detail below or beside it. */
:root{
  --paper:#f7f8fa; --panel:#ffffff; --ink:#1b2430; --ink-2:#55606e; --ink-3:#8b95a3; --line:#dde2e8; --line-2:#eef1f4;
  --accent:#1f5f8b; --accent-ink:#ffffff;
  --blue:#2f6db5; --blue-soft:#dce8f7; --blue-ink:#17406e;
  --orange:#d9772a; --orange-soft:#fbe6d3; --orange-ink:#7a3d0b;
  --green:#2e8b57; --green-soft:#d8f0e1; --green-ink:#145232;
  --purple:#7a3fa5; --purple-soft:#eadcf6; --purple-ink:#46205f;
  --teal:#1f8a8a; --teal-soft:#d4eeee; --teal-ink:#0f4f4f;
  --pink:#c2457a; --pink-soft:#f8dbe7; --pink-ink:#6e1f42;
  --holiday:#b48a16; --holiday-soft:#fff3c4;
  --change:#6b4fbb; --change-soft:#e7e0f8;
  --warn:#b4322b; --warn-soft:#fbe3e1; --ok:#1e7f4f;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --paper:#12171d; --panel:#1a2129; --ink:#e8ecf1; --ink-2:#aab3bf; --ink-3:#7c8694; --line:#2c3541; --line-2:#222a34;
  --accent:#6fb0e0; --accent-ink:#0d1a26;
  --blue:#6ea5e6; --blue-soft:#1d3a5e; --blue-ink:#cfe2fa;
  --orange:#f0995a; --orange-soft:#4a2a10; --orange-ink:#fbdcc2;
  --green:#5fc08a; --green-soft:#17392a; --green-ink:#c9f0d8;
  --purple:#b78ae0; --purple-soft:#33204a; --purple-ink:#e6d6f7;
  --teal:#5fc0c0; --teal-soft:#153a3a; --teal-ink:#cdeeee;
  --pink:#e37aa8; --pink-soft:#46202f; --pink-ink:#f8d6e4;
  --holiday:#e3c14f; --holiday-soft:#3d3312;
  --change:#b39cf0; --change-soft:#2c2347;
  --warn:#f08078; --warn-soft:#45201e; --ok:#5fc08a; }}
:root[data-theme="dark"]{ color-scheme:dark;
  --paper:#12171d; --panel:#1a2129; --ink:#e8ecf1; --ink-2:#aab3bf; --ink-3:#7c8694; --line:#2c3541; --line-2:#222a34;
  --accent:#6fb0e0; --accent-ink:#0d1a26;
  --blue:#6ea5e6; --blue-soft:#1d3a5e; --blue-ink:#cfe2fa;
  --orange:#f0995a; --orange-soft:#4a2a10; --orange-ink:#fbdcc2;
  --green:#5fc08a; --green-soft:#17392a; --green-ink:#c9f0d8;
  --purple:#b78ae0; --purple-soft:#33204a; --purple-ink:#e6d6f7;
  --teal:#5fc0c0; --teal-soft:#153a3a; --teal-ink:#cdeeee;
  --pink:#e37aa8; --pink-soft:#46202f; --pink-ink:#f8d6e4;
  --holiday:#e3c14f; --holiday-soft:#3d3312;
  --change:#b39cf0; --change-soft:#2c2347;
  --warn:#f08078; --warn-soft:#45201e; --ok:#5fc08a; }
/* parent colors are chosen in Settings; the root carries data-cm / data-cf */
:root[data-cm="blue"]{--cM:var(--blue);--cM-soft:var(--blue-soft);--cM-ink:var(--blue-ink)} :root[data-cf="blue"]{--cF:var(--blue);--cF-soft:var(--blue-soft);--cF-ink:var(--blue-ink)}
:root[data-cm="orange"]{--cM:var(--orange);--cM-soft:var(--orange-soft);--cM-ink:var(--orange-ink)} :root[data-cf="orange"]{--cF:var(--orange);--cF-soft:var(--orange-soft);--cF-ink:var(--orange-ink)}
:root[data-cm="green"]{--cM:var(--green);--cM-soft:var(--green-soft);--cM-ink:var(--green-ink)} :root[data-cf="green"]{--cF:var(--green);--cF-soft:var(--green-soft);--cF-ink:var(--green-ink)}
:root[data-cm="purple"]{--cM:var(--purple);--cM-soft:var(--purple-soft);--cM-ink:var(--purple-ink)} :root[data-cf="purple"]{--cF:var(--purple);--cF-soft:var(--purple-soft);--cF-ink:var(--purple-ink)}
:root[data-cm="teal"]{--cM:var(--teal);--cM-soft:var(--teal-soft);--cM-ink:var(--teal-ink)} :root[data-cf="teal"]{--cF:var(--teal);--cF-soft:var(--teal-soft);--cF-ink:var(--teal-ink)}
:root[data-cm="pink"]{--cM:var(--pink);--cM-soft:var(--pink-soft);--cM-ink:var(--pink-ink)} :root[data-cf="pink"]{--cF:var(--pink);--cF-soft:var(--pink-soft);--cF-ink:var(--pink-ink)}
:root{--cM:var(--blue);--cM-soft:var(--blue-soft);--cM-ink:var(--blue-ink);--cF:var(--orange);--cF-soft:var(--orange-soft);--cF-ink:var(--orange-ink)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:22px;font-weight:700} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:13px} .warnt{color:var(--warn)} .okt{color:var(--ok)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .tag{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:var(--r);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.place{display:none;padding-top:18px}
.place.on{display:block}
.banner{margin-bottom:14px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{border-color:var(--warn);background:var(--warn-soft)}

.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
.who::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.who.M{--c:var(--cM)} .who.F{--c:var(--cF)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:860px){.cal-grid{grid-template-columns:1fr}}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
@media (max-width:700px){.today{grid-template-columns:1fr}}
.today > div{padding:14px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;border-left:5px solid var(--edge,transparent);min-width:0}
.today > div:last-child{border-right:0}
@media (max-width:700px){.today > div{border-right:0;border-bottom:1px solid var(--line-2)} .today > div:last-child{border-bottom:0}}
.today .big{font-family:var(--display);font-size:20px;font-weight:700}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--ink-2);padding:6px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.month-title{font-family:var(--display);font-size:20px;font-weight:700;min-width:170px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.sw.M{background:var(--cM-soft);border:1px solid var(--cM)} .sw.F{background:var(--cF-soft);border:1px solid var(--cF)}
.sw.h{background:var(--holiday-soft);border:1px solid var(--holiday)} .sw.c{background:var(--change-soft);border:1px solid var(--change)}
.sw.x{background:linear-gradient(135deg,var(--cM-soft) 50%,var(--cF-soft) 50%);border:1px solid var(--ink-3)}
.sw.bad{border:2px solid var(--warn)} .sw.cap{border:2px dashed var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--ink-3);font-weight:700;padding-bottom:4px}
.day{position:relative;min-height:74px;border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.day.M{background:var(--cM-soft);border-color:transparent;color:var(--cM-ink)}
.day.F{background:var(--cF-soft);border-color:transparent;color:var(--cF-ink)}
.day.x{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);border-color:transparent}
.day.pad{opacity:.35;cursor:default;background:var(--panel)}
.day.off{background:var(--panel);color:var(--ink-3)}
.day.today{box-shadow:0 0 0 2px var(--ink) inset}
.day[aria-current="true"]{box-shadow:0 0 0 2px var(--accent) inset}
.day.bad{outline:2px solid var(--warn);outline-offset:-2px}
.day.cap{outline:2px dashed var(--ink-2);outline-offset:-2px}
.day .n{font-weight:700;font-size:13px}
.day .ini{position:absolute;top:5px;right:7px;font-size:11px;font-weight:700;opacity:.8}
.day .xch{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--panel);color:var(--ink);border-radius:4px;padding:1px 4px;align-self:flex-start;border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .band{font-size:11px;line-height:1.2;background:var(--holiday-soft);color:var(--ink);border-left:3px solid var(--holiday);padding:1px 4px;border-radius:2px;margin:0 -3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .band.c{background:var(--change-soft);border-left-color:var(--change)}
@media (max-width:560px){.day{min-height:60px;padding:4px} .day .band{font-size:10px} .day .xch{font-size:10px} .day .ini{font-size:10px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.rule{border-top:1px solid var(--line-2)}
.notice{font-size:13px;color:var(--ink-2);background:var(--paper);border-radius:var(--r);padding:8px 10px;border:1px solid var(--line-2)}
.notice.warn{color:var(--ink);border-color:var(--warn);background:var(--warn-soft)}
.agenda{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.agenda .mh{padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.agenda .mh:first-child{border-top:0}
.ag{display:grid;grid-template-columns:120px 64px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);align-items:baseline}
.ag:last-child{border-bottom:0}
.ag.past{opacity:.55}
@media (max-width:560px){.ag{grid-template-columns:96px 56px 1fr;gap:8px;font-size:14px}}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.mini h4{margin:0 0 6px;font-size:14px}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .c{height:18px;border-radius:3px;font-size:10px;display:flex;align-items:center;justify-content:center}
.mini .c.M{background:var(--cM-soft)} .mini .c.F{background:var(--cF-soft)} .mini .c.x{background:linear-gradient(135deg,var(--cM-soft) 50%,var(--cF-soft) 50%)}
.mini .c.h{box-shadow:inset 0 -3px 0 var(--holiday)} .mini .c.c0{box-shadow:inset 0 -3px 0 var(--change)}
.mini .c.pad{opacity:0}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.c{background:var(--change-soft);color:var(--change);border-color:transparent}
.pill.h{background:var(--holiday-soft);color:var(--ink);border-color:transparent}
.pill.w{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* settings */
.set-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.set-grid{grid-template-columns:1fr}}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nav button{display:grid;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:12px 14px;border-bottom:1px solid var(--line-2);grid-template-columns:24px 1fr;gap:10px;align-items:start}
.nav button:last-child{border-bottom:0}
.nav button[aria-selected="true"]{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent)}
.nav .num{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px}
.nav .t{font-weight:700} .nav .s{font-size:13px;color:var(--ink-2)}
.edit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.edit .head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
.edit .head p{max-width:62ch}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form.four{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form.tight{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:13px;color:var(--ink-2);font-weight:700}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:18px;height:18px}
.help{font-size:13px;color:var(--ink-2)}
.help summary{cursor:pointer;color:var(--accent);font-weight:700}
.help ol{margin:6px 0 0 18px;padding:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .res{font-size:13px;color:var(--ink-2)}
.item input[type=checkbox]{width:18px;height:18px}
.item .sub{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px;padding:8px 0 4px;border-top:1px dashed var(--line)}
.item.open{background:var(--paper)}
.preview{display:flex;flex-direction:column;gap:6px}
.strip{display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
.strip span{height:22px;border-radius:3px;font-size:10px;display:flex;align-items:center;justify-content:center}
.strip .M{background:var(--cM-soft)} .strip .F{background:var(--cF-soft)} .strip .x{background:linear-gradient(135deg,var(--cM-soft) 50%,var(--cF-soft) 50%)}
.strip .h{box-shadow:inset 0 -3px 0 var(--holiday)}
.foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:14px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblbox{overflow-x:auto}
.wrows{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;align-items:end;padding:8px;border:1px solid var(--line-2);border-radius:8px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

/* setup */
.setup{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px}
.steps button{font-size:11px;font-weight:700;color:var(--ink-3);padding:8px 0 0;border:0;border-top:3px solid var(--line);text-transform:uppercase;letter-spacing:.05em;background:transparent;text-align:left}
.steps button.done{border-color:var(--accent);color:var(--ink-2)}
.steps button.now{border-color:var(--ink);color:var(--ink)}
@media (max-width:560px){.steps button{font-size:0;padding-top:0;height:6px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card .lead{color:var(--ink-2);max-width:62ch}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tpl button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tpl button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl .bar{display:flex;gap:1px;height:8px}
.tpl .bar i{flex:1;border-radius:1px}
.tpl .bar i.M{background:var(--cM)} .tpl .bar i.F{background:var(--cF)}
.tpl .nm{font-weight:700;font-size:14px} .tpl .ds{font-size:12px;color:var(--ink-2)}
.review dl{margin:0;display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:14px}
.review dt{color:var(--ink-3)} .review dd{margin:0}
@media (max-width:560px){.review dl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.day{transition:transform .08s} .day:hover{transform:translateY(-1px)}}
@media print{.top,.toolbar,.legend,#dayPanel,.banner{display:none!important} body{padding:0;background:#fff;color:#000} .place{display:none} #place-cal{display:block} .day{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Custody Calendar</h1><span class="tag">runs in your browser; nothing is sent anywhere</span></div>
  <nav class="tabs" role="tablist" aria-label="Places">
    <button role="tab" id="tab-cal" aria-selected="true" data-go="cal">Calendar</button>

// ----- state -----
// Presets written in role words become a slot pattern: the pattern's first number is always Parent 1's days.
function presetPattern(p){ if(!p.roleDays)return p.pattern; const mom=resolveWho('mother'); return mom==='M'?`${p.roleDays.mother},${p.roleDays.father}`:`${p.roleDays.father},${p.roleDays.mother}`; }
function planDefaults(){

}
function migrateOld(){

let STATE=null;

// ----- config for the engine (engine.js does the work; the page passes its state) -----

const UI={place:'cal',view:'month',cur:null,sel:null,section:'people',step:1,openHol:null,openVac:null,openChg:null,agendaAll:false,note:''};

// ----- helpers for display -----
function periodText(entry,cfg,y){ const list=periodsFor(entry,cfg,y,entry.rule?entry.rule(y):entry.day(y)); if(!list.length)return `${y}: no dates`; return list.map(p=>`${y}: ${fD(p.s)} ${hm(p.s)} to ${fD(p.e)} ${hm(p.e)}, ${PN(p.who)}`).join('; '); }

function childText(c){ const m=/^(\d{1,2})-(\d{1,2})$/.exec((c.md||'').trim()); if(!m)return 'no birthday entered'; const Y=new Date().getFullYear(); const entry={name:'b',pri:1,day:y=>utc(y,+m[1],+m[2])}; return [Y,Y+1].map(y=>periodText(entry,c,y)).join(' · '); }
function regularText(){ const r=STATE.regular; if(!r.on)return 'not used'; const pat=String(r.pattern).split(/[,\s/-]+/).filter(Boolean); const parts=[]; pat.forEach((n,k)=>{ const who=(k%2===0)?'M':'F'; parts.push(`${n} with ${PN(who)}`); }); let s=parts.join(', '); if(resolveWho(r.first)==='F')s+=` (starts with ${PN('F')})`; return `${s}, exchanges at ${r.xtime}`; }

function localText(){ const p=STATE.phase; if(!p.weeklyOn)return 'not used'; const n=p.weekly.rows.length; return `${p.weeksPerCycle||2}-week cycle, ${n} period${n===1?'':'s'}, Week A from ${p.weekAnchor?usdStr(p.weekAnchor):'(no date)'}`; }
const APPLIES=[['both','Both schedules'],['ld','Long distance schedule only'],['local','Local schedule only']];
const appliesText=a=>a==='ld'?'long distance only':a==='local'?'local only':'';
const appliesTag=a=>a&&a!=='both'?` <span class="pill">${appliesText(a)}</span>`:'';
function vacUsed(who,y){ let n=0; for(const v of STATE.vacations.list){ if(v.who!==who||!v.s||!v.e)continue; const s=parseDate(v.s); if(s===null||new Date(s).getUTCFullYear()!==y)continue; const e=parseDate(v.e); n+=Math.max(0,(e+parseHours(v.eh)*HOUR-s-parseHours(v.sh)*HOUR)/DAYMS); } return n; }
function vacWarnings(v){ const w=[]; const s=parseDate(v.s), e=parseDate(v.e); if(s===null||e===null)return ['Enter a first and a last day.']; const S=s+parseHours(v.sh)*HOUR, E=e+parseHours(v.eh)*HOUR; if(E<=S)return ['The end is before the start.'];
  const len=(E-S)/DAYMS; const A=STATE.vacations; if(A.maxLen&&len>A.maxLen)w.push(`${fmt1(len)} days is longer than the ${A.maxLen}-day limit for one vacation.`);
  const y=new Date(S).getUTCFullYear(); const used=vacUsed(v.who,y); if(A.allow[v.who]&&used>A.allow[v.who])w.push(`${PN(v.who)} would use ${fmt1(used)} of ${A.allow[v.who]} vacation days in ${y}.`);

  return w; }
function changeText(ch){ if(ch.kind==='give'){ if(!ch.s||!ch.e)return 'dates missing'; return `${PN(ch.who)} has ${fD(parseDate(ch.s))} ${ch.sh} to ${fD(parseDate(ch.e))} ${ch.eh}`; } const p=changePeriod(ch); const od=parseDate(ch.date); if(od===null)return 'date missing'; if(!p)return ch.newDate&&ch.newTime? `No exchange at ${fD(od)} ${ch.time} in the regular calendar. Pick the exchange's own date and time.`:'incomplete'; const o=od+parseHours(ch.time)*HOUR, n=parseDate(ch.newDate||ch.date)+parseHours(ch.newTime)*HOUR; return `Exchange of ${fD(o)} ${hm(o)} happens ${fD(n)} ${hm(n)} instead; ${PN(p.who)} has the time in between.`; }

// ===================== Calendar place =====================
function renderCal(){

  if(ERR)b+=`<div class="banner err">${esc(ERR)} <button class="btn sm" data-go="set">Open Settings</button></div>`;
  else if(RESULT&&RESULT.noMove)b+=`<div class="banner">No move date entered, so the calendar shows the local schedule only. <button class="btn sm" data-go="set" data-sec="change">Enter the move date</button></div>`;

  $('legend').innerHTML=`<span><i class="sw M"></i>${esc(PN('M'))}</span><span><i class="sw F"></i>${esc(PN('F'))}</span><span><i class="sw x"></i>exchange day, split at the time shown</span><span><i class="sw h"></i>holiday or vacation</span><span><i class="sw c"></i>one-time change</span><span><i class="sw cap"></i>moved by the day limit</span><span><i class="sw bad"></i>over the limit</span>`;

}
function renderToday(){

  const nextP=r.periods.filter(p=>p.s>now&&p.pri>=1&&p.pri<=3).sort((a,b)=>a.s-b.s)[0];

   <div><span class="eyebrow">Coming up</span>${nextP?`<span class="big">${esc(nextP.name)}</span><span class="small muted"><span class="who ${nextP.who}">${esc(PN(nextP.who))}</span> · ${fDT(nextP.s)} to ${fDT(nextP.e)}</span>`:'<span class="big">no holiday in range</span>'}</div>`;
}
function childLabel(){ const names=STATE.children.map(c=>c.name).filter(Boolean); if(!names.length)return 'The child is'; if(names.length===1)return names[0]+' is'; return names.slice(0,-1).join(', ')+' and '+names[names.length-1]+' are'; }
function humanWhy(x){ if(x.kind==='change')return `One-time change: ${esc(x.why.replace(/ (begins|ends)$/,''))}.`; if(x.kind==='limit')return 'Moved by the day limit rule.'; if(x.kind==='period')return esc(x.why.charAt(0).toUpperCase()+x.why.slice(1))+'.'; return x.why==='local schedule'?'Local schedule.':'Long distance schedule.'; }

function renderMonth(){

  const first=utc(cur.y,cur.m,1); const lead=(dow(first)+6)%7; const nd=new Date(utc(cur.y,cur.m+1,0)).getUTCDate();

  let rule; if(info.ppri===0)rule=`One-time change: ${esc(info.pname)}.`; else if(info.pname)rule=`${esc(info.pname)}: ${esc(PN(info.pwho))} has this period.${info.chg?` One-time change today: ${esc(info.chg)}.`:''}`; else if(info.cap)rule='Moved to the other parent by the day limit rule.'; else rule=RESULT.inLocal(t+12*HOUR)?'Local schedule.':`Long distance schedule: ${esc(regularText())}.`;
  if(info.bad)rule+=` <span class="warnt">Part of a stretch over the ${STATE.cal.limit}-day limit.</span>`;
  const withLine=info.second?`<span class="who ${info.first}">${esc(PN(info.first))}</span> until <span class="mono">${String(info.firstH).padStart(2,'0')}:00</span>, then <span class="who ${info.second}">${esc(PN(info.second))}</span>`:`<span class="who ${info.first}">${esc(PN(info.first))}</span> all day`;
  const inRange=RESULT.periods.filter(p=>p.s<t+DAYMS&&p.e>t&&p.pri>0).sort((a,b)=>a.pri-b.pri);
  el.innerHTML=`
   <div><span class="eyebrow">Selected day</span><h3>${fDL(t)}</h3></div>
   <dl class="kv">
     <dt>With</dt><dd>${withLine}</dd>
     ${xs.map(x=>`<dt>Exchange</dt><dd><span class="mono">${hm(x.t)}</span>, ${esc(PN(x.from))} to ${esc(PN(x.to))}${x.kind==='change'?' <span class="pill c">changed</span>':''}<br><span class="small muted">${humanWhy(x)}${exchangePlace(x)}</span></dd>`).join('')}
     <dt>Rule</dt><dd>${rule}</dd>
     ${inRange.length>1?`<dt>Also</dt><dd class="small muted">${inRange.slice(1).map(p=>esc(p.name)).join(', ')} (lower priority)</dd>`:''}
   </dl>
   <div class="rule"></div>
   <div class="row">
     ${xs.map(x=>`<button class="btn sm" data-act="changeExchange" data-arg="${x.t}">Change the ${hm(x.t)} exchange</button>`).join('')}
     <button class="btn sm" data-act="addVacHere" data-arg="${UI.sel}">Add a vacation here</button>
     <button class="btn sm" data-act="giveHere" data-arg="${UI.sel}">Give this day to a parent</button>
     <button class="btn sm quiet" data-go="set" data-sec="hol">Edit holidays</button>
   </div>
   <p class="notice">A change made from here applies to this date only. The regular schedule is not touched.</p>`;
}
function exchangePlace(x){ const pl=(x.why==='local schedule')?STATE.phase.weekly.place:STATE.regular.place; return pl&&x.kind==='regular'?` At ${esc(pl)}.`:''; }
function renderAgenda(){
  const el=$('agenda'); if(!RESULT){el.innerHTML='';return;} const now=nowT();
  const list=UI.agendaAll?RESULT.exchanges:RESULT.exchanges.filter(x=>x.t>=now-DAYMS).slice(0,60);
  $('agendaHint').textContent=UI.agendaAll?`${RESULT.exchanges.length} exchanges, ${fDY(RESULT.t0)} to ${fDY(RESULT.t1-DAYMS)}`:`Next ${list.length} exchanges from today.`;
  let html='', lastKey='';
  for(const x of list){ const d=new Date(x.t); const k=`${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; if(k!==lastKey){lastKey=k;html+=`<div class="mh eyebrow">${k}</div>`;}
    const pill=x.kind==='change'?`<span class="pill c">${esc(x.why.replace(/ (begins|ends)$/,''))}</span>`:x.kind==='period'?`<span class="pill h">${esc(x.why)}</span>`:x.kind==='limit'?`<span class="pill w">day limit rule</span>`:`<span class="pill">${esc(x.why)}</span>`;

  el.innerHTML=html||'<div class="ag"><span></span><span></span><span class="muted">No exchanges.</span></div>';
}
function renderYear(){
  const el=$('year'); if(!RESULT){el.innerHTML='';return;} const y=UI.cur.y; let html='';
  for(let m=1;m<=12;m++){ const first=utc(y,m,1), lead=(dow(first)+6)%7, nd=new Date(utc(y,m+1,0)).getUTCDate(); let g='';
    for(let i=0;i<lead;i++)g+='<span class="c pad"></span>';
    for(let d=1;d<=nd;d++){ const info=dayCell(ymd(utc(y,m,d))); g+=`<span class="c ${info?(info.second?'x':info.first):''}${info&&info.ppri>0?' h':''}${info&&info.ppri===0?' c0':''}">${d}</span>`; }
    html+=`<button type="button" class="mini" data-month="${m}"><h4>${MON[m-1]} ${y}</h4><div class="g">${g}</div></button>`; }

    <button class="btn sm" style="align-self:flex-start" data-act="addCustom">+ Add another kind of period</button>`; }
  case 'changes': return `<div class="head"><div><h2>One-time changes</h2><p class="muted">A pickup moved, a day swapped, a weekend traded. Each applies to its date only. The regular schedule is never edited for a one-off. The easiest way to add one is from the day on the calendar.</p></div><span class="row"><button class="btn sm primary" data-act="addChange" data-arg="move">+ Move an exchange</button><button class="btn sm" data-act="addChange" data-arg="give">+ Give time to a parent</button></span></div>
    <div class="list">${S.changes.length?S.changes.map((ch,i)=>{ const open=UI.openChg===ch.id; return `<div class="item${open?' open':''}"><span class="pill c">${ch.kind==='give'?'time given':'exchange moved'}</span><div><b>${esc(ch.note||'One-time change')}</b>${appliesTag(ch.applies)}<div class="res">${esc(changeText(ch))}</div></div><span class="row"><button class="btn sm" data-act="chgEdit" data-arg="${ch.id}">${open?'Close':'Edit'}</button><button class="btn sm danger" data-act="rmChange" data-arg="${i}">Remove</button></span>
      ${open?`<div class="sub">${ch.kind==='give'?`<div class="form tight">${fld('Parent',sel(`changes.${i}.who`,[['M',PN('M')],['F',PN('F')]]))}${fld('From',inp(`changes.${i}.s`,{type:'date'}))}${fld('at',inp(`changes.${i}.sh`,{type:'time'}))}${fld('To',inp(`changes.${i}.e`,{type:'date'}))}${fld('at',inp(`changes.${i}.eh`,{type:'time'}))}${fld('Note (shown on the calendar)',inp(`changes.${i}.note`,{ph:'Swapped for the recital'}))}${fld('Applies under',sel(`changes.${i}.applies`,APPLIES))}</div>`:`<div class="form tight">${fld('Exchange on',inp(`changes.${i}.date`,{type:'date'}))}${fld('at',inp(`changes.${i}.time`,{type:'time'}))}${fld('Happens instead on',inp(`changes.${i}.newDate`,{type:'date'}))}${fld('at',inp(`changes.${i}.newTime`,{type:'time'}))}${fld('Note (shown on the calendar)',inp(`changes.${i}.note`,{ph:'School concert'}))}${fld('Applies under',sel(`changes.${i}.applies`,APPLIES))}</div><p class="help">The parent who had the child before the exchange keeps the child until the new time, or the receiving parent gets the child earlier.</p>`}</div>`:''}</div>`; }).join(''):'<div class="item"><span></span><span class="muted">No one-time changes.</span><span></span></div>'}</div>`;
  case 'limits': { const r=RESULT; return `<div class="head"><div><h2>Limits and range</h2><p class="muted">Rules that protect the child from long gaps, and how far the calendar reaches.</p></div></div>
    <div class="form">${fld('Longest time away from either parent (days)',inp('cal.limit',{type:'number',num:true,min:1,max:365}))}${fld('If a holiday pushes past the limit',sel('cal.mode',[['cap','Give the other parent the extra days next to the holiday'],['none','Only mark it on the calendar']]))}${fld('Calendar starts on',inp('cal.start',{type:'date'}))}${fld('Years to cover',inp('cal.years',{type:'number',num:true,min:1,max:10}))}</div>
    <p class="help">The extra days come from the regular time next to the holiday: from the end of the stretch where it meets the other parent's next block; if the stretch ends with a holiday, from its start. The rule applies under the long distance schedule only.</p>
    ${r?`<div class="tblbox"><table class="tbl"><thead><tr><th>Year</th><th class="num">${esc(PN('M'))} days</th><th class="num">${esc(PN('F'))} days</th><th class="num">Exchanges</th><th class="num">Longest with ${esc(PN('M'))}</th><th class="num">Longest with ${esc(PN('F'))}</th><th>Over the limit</th><th class="num">Days moved</th></tr></thead><tbody>${r.summary.map(s=>`<tr><td>${s.y}</td><td class="num">${fmt1(s.mDays)}</td><td class="num">${fmt1(s.fDays)}</td><td class="num">${s.ex}</td><td class="num">${fmt1(s.lm)}</td><td class="num">${fmt1(s.lf)}</td><td class="${s.over.length?'warnt':'okt'}">${s.over.length?s.over.length+' stretch'+(s.over.length>1?'es':''):'none'}</td><td class="num">${fmt1(s.moved)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Days are counted in hours; an exchange day is split at the exchange time, so totals can end in a decimal.</p>
    ${r.over.length?`<div class="notice warn"><b>${r.over.length} stretch${r.over.length>1?'es':''} over ${S.cal.limit} days:</b><br>${r.over.map(sg=>`${fDT(sg.s)} to ${fDT(sg.e)}: ${fmt1(sg.h/24)} days with ${esc(PN(sg.p))}`).join('<br>')}</div>`:`<div class="notice">Nothing goes over ${S.cal.limit} days in the range.</div>`}`:''}`; }
  case 'share': return `<div class="head"><div><h2>Share and export</h2><p class="muted">Settings stay in this browser. A link carries them to any other phone or computer. Nothing is stored on a server.</p></div></div>
    <div class="list">
     <div class="item"><span class="pill">link</span><div><b>Share link</b><div class="res">Opens this exact calendar, with every setting, on the other parent's device. Send it again after a change.</div><input class="mono small" style="width:100%;margin-top:6px;font:inherit;font-family:var(--mono);font-size:12px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)" readonly value="${esc(shareLink())}" id="shareUrl"></div><button class="btn sm primary" data-act="copyLink">Copy link</button></div>
     <div class="item"><span class="pill">.ics</span><div><b>Calendar file</b><div class="res">Apple Calendar, Outlook, Google Calendar import. One event per block and one per exchange.</div></div><button class="btn sm" data-act="ics">Download</button></div>
     <div class="item"><span class="pill">.csv</span><div><b>Spreadsheet of blocks and exchanges</b><div class="res">Google Calendar's CSV import format.</div></div><button class="btn sm" data-act="csv">Download</button></div>
     <div class="item"><span class="pill">text</span><div><b>Exchange list</b><div class="res">Copied as plain text for a message or email.</div></div><button class="btn sm" data-act="copyList">Copy</button></div>
     <div class="item"><span class="pill">print</span><div><b>Print</b><div class="res">Prints the calendar view that is open (month, exchanges or year).</div></div><button class="btn sm" data-act="print">Print</button></div>
    </div>
    <p class="small muted" id="saveMsg"></p>
    <h3>Start over</h3>
    <div class="row"><button class="btn sm" data-act="loadPlan">Load the parenting plan defaults</button><button class="btn sm" data-act="runSetup">Run the setup again</button></div>
    <div class="notice">Runs entirely in the browser. Nothing you enter is sent anywhere. A planning aid, not legal advice; the parenting plan controls.</div>`;
  }
  return '';
}
function renderEdit(){ $('setEdit').innerHTML=secHtml(UI.section)+`<div class="foot"><span class="small muted">Changes apply at once and are saved in this browser.</span><button class="btn quiet" data-go="cal">&#8592; Back to calendar</button></div>`; }

// ===================== Setup place =====================
const STEPS=[['Who','people'],['Long distance','regular'],['Local','local'],['In force','change'],['Holidays','hol'],['Vacations','vac'],['Limits','limits'],['Finish','review']];
function reviewHtml(){ const S=STATE; const hol=Object.entries(S.holidays).filter(([,h])=>h.on).map(([id])=>hName(CAT.find(h=>h.id===id))); return `<div class="head"><div><h2>${STEPS.length}. Check and finish</h2><p class="muted">Everything here can be changed later from Settings. Tap a line to go back to it.</p></div></div>
  <div class="review"><dl>
   <dt><a href="#" data-step="1">Parents</a></dt><dd><span class="who M">${esc(PN('M'))}</span> &nbsp; <span class="who F">${esc(PN('F'))}</span></dd>
   <dt><a href="#" data-step="1">Children</a></dt><dd>${S.children.filter(c=>c.on).map(c=>`${esc(c.name||'child')}, birthday ${esc(c.md||'not set')}`).join('; ')||'none'}</dd>
   <dt><a href="#" data-step="2">Long distance</a></dt><dd>${esc(regularText())}</dd>
   <dt><a href="#" data-step="3">Local</a></dt><dd>${esc(localText())}</dd>
   <dt><a href="#" data-step="4">In force</a></dt><dd>${esc(phaseText())}</dd>
   <dt><a href="#" data-step="5">Holidays</a></dt><dd>${hol.length} selected: ${esc(hol.join(', '))}</dd>
   <dt><a href="#" data-step="6">Vacations</a></dt><dd>${S.vacations.allow.M} and ${S.vacations.allow.F} days a year, ${S.vacations.notice} days notice, ${S.vacations.list.length} planned</dd>
   <dt><a href="#" data-step="7">Limit</a></dt><dd>${S.cal.limit} days; ${S.cal.mode==='cap'?'extra days go to the other parent':'only marked'}; calendar from ${esc(usdStr(S.cal.start))} for ${S.cal.years} years</dd>
  </dl></div>
  ${ERR?`<div class="notice warn">${esc(ERR)}</div>`:stripHtml()}
  <div class="notice">Your settings stay in this browser. Under Settings, Share and export, a link opens the same calendar on any other phone.</div>`; }
function renderSetup(){
  $('stepBar').innerHTML=STEPS.map((s,i)=>`<button type="button" class="${i+1<UI.step?'done':i+1===UI.step?'now':''}" data-step="${i+1}">${i+1}. ${s[0]}</button>`).join('');
  const sec=STEPS[UI.step-1][1]; const body=sec==='review'?reviewHtml():secHtml(sec).replace(/<h2>/,`<h2>${UI.step}. `);
  $('setupCard').innerHTML=body+`<div class="foot"><button class="btn" data-act="stepPrev"${UI.step===1?' disabled':''}>Back</button><span class="small muted">Step ${UI.step} of ${STEPS.length}</span><button class="btn primary" data-act="stepNext">${UI.step===STEPS.length?'Finish and open the calendar':'Next'}</button></div>`;
}

// ===================== places and events =====================
function go(p,sec){ UI.place=p; for(const k of ['cal','set','setup']){ $('place-'+k).classList.toggle('on',k===p); $('tab-'+k).setAttribute('aria-selected',k===p); } if(sec)UI.section=sec; render(); window.scrollTo({top:0}); }
function render(){ if(UI.place==='cal')renderCal(); else if(UI.place==='set')renderSet(); else renderSetup(); }
function rerender(){ rebuild(); render(); }

document.addEventListener('change',e=>{
  const t=e.target; if(!bindInput(t))return;
  if(/^parents\.[MF]\.role$/.test(t.dataset.b)){ const p=PRESETS[STATE.regular.preset]; if(p&&p.roleDays)STATE.regular.pattern=presetPattern(p); }
  // a holiday edited while unticked turns on
  const m=/^holidays\.([^.]+)\./.exec(t.dataset.b); if(m&&STATE.holidays[m[1]])STATE.holidays[m[1]].on=true;
  rerender();
});
document.addEventListener('click',async e=>{
  const a=e.target.closest('a[data-step]'); if(a){ e.preventDefault(); UI.step=+a.dataset.step; renderSetup(); window.scrollTo({top:0}); return; }
  const b=e.target.closest('button,input[type=checkbox][data-act]'); if(!b)return;
  if(b.dataset.go){ go(b.dataset.go,b.dataset.sec); return; }
  if(b.dataset.sec&&!b.dataset.act){ UI.section=b.dataset.sec; if(UI.place!=='set')go('set'); else {renderSet();window.scrollTo({top:0});} return; }
  if(b.dataset.view){ setView(b.dataset.view); return; }
  if(b.dataset.day){ UI.sel=b.dataset.day; renderMonth(); renderPanel(); return; }
  if(b.dataset.month){ UI.cur={y:UI.cur.y,m:+b.dataset.month}; setView('month'); return; }
  if(b.dataset.step&&!b.dataset.act){ UI.step=+b.dataset.step; renderSetup(); return; }
  const act=b.dataset.act, arg=b.dataset.arg; if(!act)return;
  const S=STATE;
  switch(act){
    case 'prevMonth': { let {y,m}=UI.cur; m--; if(m<1){m=12;y--;} UI.cur={y,m}; if(UI.view==='year')renderYear(); else renderMonth(); return; }
    case 'nextMonth': { let {y,m}=UI.cur; m++; if(m>12){m=1;y++;} UI.cur={y,m}; if(UI.view==='year')renderYear(); else renderMonth(); return; }
    case 'goToday': { const d=new Date(); UI.cur={y:d.getFullYear(),m:d.getMonth()+1}; UI.sel=ymd(todayT()); setView('month'); renderPanel(); return; }
    case 'agendaAll': UI.agendaAll=!UI.agendaAll; b.textContent=UI.agendaAll?'Show from today':'Show the whole calendar'; renderAgenda(); return;
    case 'changeExchange': { const t=+arg; const id=uid(); S.changes.push({id,kind:'move',date:ymd(t),time:hm(t),newDate:ymd(t),newTime:hm(t),note:''}); UI.openChg=id; rerender(); go('set','changes'); return; }
    case 'addVacHere': { const id=uid(); const s=parseDate(arg); S.vacations.list.push({id,who:'M',s:arg,sh:'10:00',e:ymd(addD(s,7)),eh:'10:00',note:''}); UI.openVac=id; rerender(); go('set','vac'); return; }
    case 'giveHere': { const id=uid(); const s=parseDate(arg); const info=dayCell(arg); const other=info?(info.first==='M'?'F':'M'):'M'; S.changes.push({id,kind:'give',who:other,s:arg,sh:'00:00',e:ymd(addD(s,1)),eh:'00:00',note:''}); UI.openChg=id; rerender(); go('set','changes'); return; }
    case 'color': { const [code,c]=arg.split(':'); S.parents[code].color=c; const o=code==='M'?'F':'M'; if(S.parents[o].color===c)S.parents[o].color=COLORS.find(x=>x!==c); rerender(); return; }
    case 'addChild': S.children.push({id:uid(),name:'',md:'',who:'motherOdd',before:0,after:1,start:'16:00',end:'10:00',on:true}); rerender(); return;
    case 'rmChild': S.children.splice(+arg,1); rerender(); return;
    case 'preset': { const p=PRESETS[arg]; S.regular.preset=arg; S.regular.on=true; const pat=presetPattern(p); if(pat){S.regular.pattern=pat;S.regular.first=p.first;S.regular.xtime=p.xtime;} rerender(); return; }
    case 'addRow': S.phase.weekly.rows.push({week:1,parent:'father',sd:5,st:'17:00',ed:0,et:'17:00'}); rerender(); return;
    case 'rmRow': S.phase.weekly.rows.splice(+arg,1); rerender(); return;
    case 'holOn': { const h=CAT.find(x=>x.id===arg); if(!S.holidays[arg])S.holidays[arg]={on:false,...(h.plan||{who:'motherOdd',before:0,after:0,start:'00:00',end:'24:00'}),...(PLANSET[arg]||{}),dates:'',applies:h.sameCity?'local':'both'}; S.holidays[arg].on=b.checked; rerender(); return; }
    case 'holEdit': { const h=CAT.find(x=>x.id===arg); if(!S.holidays[arg])S.holidays[arg]={on:false,...(h.plan||{who:'motherOdd',before:0,after:0,start:'00:00',end:'24:00'}),...(PLANSET[arg]||{}),dates:'',applies:h.sameCity?'local':'both'}; UI.openHol=UI.openHol===arg?null:arg; render(); return; }
    case 'addVac': { const id=uid(); const s=addD(todayT(),S.vacations.notice||30); S.vacations.list.push({id,who:'M',s:ymd(s),sh:'10:00',e:ymd(addD(s,7)),eh:'10:00',note:''}); UI.openVac=id; rerender(); return; }
    case 'vacEdit': UI.openVac=UI.openVac===arg?null:arg; render(); return;
    case 'rmVac': S.vacations.list.splice(+arg,1); rerender(); return;
    case 'addCustom': S.customs.push({name:'Custom period',who:'M',dates:'',pri:3}); rerender(); return;
    case 'rmCustom': S.customs.splice(+arg,1); rerender(); return;
    case 'addChange': { const id=uid(); const t=todayT(); if(arg==='give')S.changes.push({id,kind:'give',who:'M',s:ymd(t),sh:'10:00',e:ymd(addD(t,1)),eh:'10:00',note:''}); else { const nx=RESULT&&RESULT.exchanges.find(x=>x.t>nowT()); const xt=nx?nx.t:t; S.changes.push({id,kind:'move',date:ymd(xt),time:hm(xt),newDate:ymd(xt),newTime:hm(xt),note:''}); } UI.openChg=id; rerender(); return; }
    case 'chgEdit': UI.openChg=UI.openChg===arg?null:arg; render(); return;
    case 'rmChange': S.changes.splice(+arg,1); rerender(); return;
    case 'copyLink': { const u=shareLink(); try{await navigator.clipboard.writeText(u); $('saveMsg').textContent='Link copied.';}catch(err){ const i=$('shareUrl'); i.select(); $('saveMsg').textContent='Select the link and copy it by hand.'; } return; }
    case 'ics': if(RESULT)saveFile('custody-calendar.ics',ics(),'text/calendar'); return;
    case 'csv': if(RESULT)saveFile('custody-calendar.csv',csv(),'text/csv'); return;
    case 'copyList': { if(!RESULT)return; const txt=RESULT.exchanges.map(x=>`${usd(x.t)} ${DOWN[dow(x.t)]} ${hm(x.t)}  ${PN(x.from)} to ${PN(x.to)}  (${x.why})`).join('\n'); try{await navigator.clipboard.writeText(txt);$('saveMsg').textContent='Exchange list copied.';}catch(err){$('saveMsg').textContent='Copy failed in this browser.';} return; }
    case 'print': go('cal'); setTimeout(()=>window.print(),100); return;
    case 'loadPlan': { const keep={parents:S.parents,children:S.children}; STATE=planDefaults(); STATE.setupDone=true; STATE.parents=keep.parents; STATE.children=keep.children; UI.note='Parenting plan defaults loaded.'; rerender(); go('cal'); return; }
    case 'runSetup': UI.step=1; go('setup'); return;
    case 'stepPrev': UI.step=Math.max(1,UI.step-1); renderSetup(); window.scrollTo({top:0}); return;
    case 'stepNext': if(UI.step===STEPS.length){ S.setupDone=true; saveState(); go('cal'); } else { UI.step++; renderSetup(); window.scrollTo({top:0}); } return;
  }
});

// ----- exports (unchanged from the earlier page) -----
function ics(){ return CCEngine.icsText(RESULT,{M:PN('M'),F:PN('F')},{name:'Custody Calendar'}); }
const usDate=t=>{const d=new Date(t);return `${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}/${d.getUTCFullYear()}`};
const usTime=t=>{const d=new Date(t);let h=d.getUTCHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(d.getUTCMinutes()).padStart(2,'0')} ${ap}`};
function csv(){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`; const rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description']];
  for(const sg of RESULT.segs)rows.push([`With ${PN(sg.p)}`,usDate(sg.s),usTime(sg.s),usDate(sg.e),usTime(sg.e),'False',`${fmt1(sg.h/24)} days`]);
  for(const x of RESULT.exchanges)rows.push([`Exchange: ${PN(x.from)} to ${PN(x.to)}`,usDate(x.t),usTime(x.t),usDate(x.t),usTime(x.t+30*60000),'False',x.why]);
  return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function saveFile(name,text,mime){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  const m=$('saveMsg'); if(m)m.textContent=`Saved ${name}`;
}

// ----- start -----
loadState();
{ const d=new Date(); UI.cur={y:d.getFullYear(),m:d.getMonth()+1}; UI.sel=ymd(todayT()); }
rebuild();
if(!STATE.setupDone){ UI.step=1; go('setup'); } else go('cal');
</script>
